# Flatpak manifest for FlashCraft.
# Build: flatpak run org.flatpak.Builder build dev.flashcraft.app.yml \
#          --force-clean --user --install-deps-from=flathub --repo=repo
app-id: dev.flashcraft.app
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: flashcraft
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --share=ipc
  # Device writes go through the host udisks2 daemon (planned); raw block
  # access stays out of the sandbox on purpose.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    - CARGO_HOME=/run/build/flashcraft/cargo
  build-args:
    - --share=network
modules:
  - name: flashcraft
    buildsystem: simple
    sources:
      - type: dir
        path: ../..
    build-commands:
      - cargo build --release -p flashcraft -p flashcraft-cli --offline || cargo build --release -p flashcraft -p flashcraft-cli
      - install -Dm755 target/release/flashcraft /app/bin/flashcraft
      - install -Dm755 target/release/flashcraft-cli /app/bin/flashcraft-cli
      - install -Dm644 packaging/linux/flashcraft.desktop /app/share/applications/dev.flashcraft.app.desktop
      - install -Dm644 packaging/linux/dev.flashcraft.app.metainfo.xml /app/share/metainfo/dev.flashcraft.app.metainfo.xml
      - install -Dm644 assets/app-icon/hicolor/128x128/apps/dev.flashcraft.app.png /app/share/icons/hicolor/128x128/apps/dev.flashcraft.app.png
      - install -Dm644 assets/app-icon/hicolor/256x256/apps/dev.flashcraft.app.png /app/share/icons/hicolor/256x256/apps/dev.flashcraft.app.png
      - install -Dm644 assets/app-icon/hicolor/512x512/apps/dev.flashcraft.app.png /app/share/icons/hicolor/512x512/apps/dev.flashcraft.app.png
      - install -Dm644 assets/app-icon/hicolor/scalable/apps/dev.flashcraft.app.svg /app/share/icons/hicolor/scalable/apps/dev.flashcraft.app.svg
      - install -Dm644 LICENSE /app/share/doc/flashcraft/LICENSE
      - install -Dm644 ATTRIBUTION.md /app/share/doc/flashcraft/ATTRIBUTION.md
