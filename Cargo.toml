[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/native",
    "crates/ui-egui",
    "apps/flashcraft",
    "apps/flashcraft-cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/cdori/flashcraft"
homepage = "https://github.com/cdori/flashcraft"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
